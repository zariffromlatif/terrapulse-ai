steps:
  # 1. Run unit test suite and quantitative benchmark validation
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest tests/
        python eval_benchmark.py

  # 2. Build the TerraPulse container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/terrapulse-repo/terrapulse-ai:$COMMIT_SHA', '.']

  # 3. Push container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/terrapulse-repo/terrapulse-ai:$COMMIT_SHA']

  # 4. Deploy to Google Cloud Run in Singapore / asia-southeast1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'terrapulse-ai'
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/terrapulse-repo/terrapulse-ai:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/terrapulse-repo/terrapulse-ai:$COMMIT_SHA'
